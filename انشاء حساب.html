<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial scale=1.0">
 <title>إنشاء حساب - نظام إدارة المخيمات</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>
 <div class="page">
 <div class="register-card"> 
                                                  <!-- الشعار -->
<div class="logo"> 
<img src="logo.png" alt="شعار النظام">
</div> 
<!-- اسم النظام --> 
<h1>نظام إدارة المخيمات</h1> 
<p class="subtitle"> إدارة ذكية وسهولة للمخيمات </p> 
<!-- العنوان -->
 <h2>إنشاء حساب</h2> 
<p class="description"> أنشئ حسابك وابدأ بإدارة مخيمك بسهولة </p>
 <form> 
<div class="input-group"> 
<label>الاسم الكامل</label> 
<input type="text" placeholder="أدخل اسمك الكامل">
 </div> 
<div class="input-group"> 
<label>البريد الإلكتروني</label>
 <input type="email" placeholder="example@email.com">
 </div>
 <div class="input-group">
 <label>كلمة المرور</label> 
<input type="password" placeholder="أدخل كلمة المرور">
 </div> 
<div class="input-group"> 
<label>تأكيد كلمة المرور</label> 
<input type="password" placeholder="أعد إدخال كلمة المرور">
 </div>
 <button type="submit"> 
إنشاء الحساب </button>
 </form> 
<p class="login-text"> 
لديك حساب بالفعل؟ 
<a href="login.html">تسجيل الدخول</a> 
</p> 
</div> 
</div>
</body>
</html>
